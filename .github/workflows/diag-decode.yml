name: Diagnose decode

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Article URL to test"
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/decode against the live worker
        run: |
          curl -sS -X POST "https://clickbyter-api.ronmailx.workers.dev/api/decode" \
            -H "Content-Type: application/json" \
            -H "Origin: https://ronmailx-boop.github.io" \
            -d "{\"url\": \"${{ inputs.url }}\"}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
      - name: Fetch the source URL directly with the worker's own User-Agent
        run: |
          curl -sS -D - -o /tmp/body.html "${{ inputs.url }}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            --max-time 15 || echo "curl exit code: $?"
          echo "--- body size ---"
          wc -c /tmp/body.html
          echo "--- first 500 bytes ---"
          head -c 500 /tmp/body.html
